<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARGUS &mdash; Your eyes. Our watch.</title>
  <meta name="description" content="Inspired by the myth of Argus, the giant with a hundred eyes, Argus helps you protect what matters most &mdash; your eyes.">
  
  <!-- Favicon placeholder (Eye of Argus icon) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A9B1E8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z'/><circle cx='12' cy='12' r='3'/></svg>" type="image/svg+xml">

  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================= -->
  <!-- HERO SECTION                                              -->
  <!-- ========================================================= -->
  <section id="hero" class="hero-section" aria-label="Hero Section">
    <!-- Background Image & Atmospheric Layers -->
    <div class="hero-bg-wrapper" aria-hidden="true">
      <img src="assets/image-1.png" alt="" class="hero-bg-img" loading="eager" fetchpriority="high">
      <div class="hero-gradient-overlay"></div>
      <div class="hero-fog-overlay"></div>
    </div>

    <!-- Hero Content Container -->
    <div class="hero-container">
      <div class="hero-content">
        <!-- Eyebrow Tagline -->
        <span class="hero-eyebrow animate-item" style="--delay: 100ms;">
          AN ANCIENT GUARDIAN, A MODERN SOLUTION.
        </span>

        <!-- Main Title -->
        <h1 class="hero-title animate-item" style="--delay: 250ms;">
          ARGUS
        </h1>

        <!-- Subtitle -->
        <p class="hero-subtitle animate-item" style="--delay: 400ms;">
          Your eyes. Our watch.
        </p>

        <!-- Accent Divider -->
        <div class="hero-divider animate-item" style="--delay: 520ms;" aria-hidden="true"></div>

        <!-- Description Paragraph -->
        <p class="hero-description animate-item" style="--delay: 620ms;">
          Inspired by the myth of Argus, the giant with a hundred eyes, Argus helps you protect what matters most &mdash; your eyes.
        </p>

        <!-- CTA Action Buttons -->
        <div class="hero-actions animate-item" style="--delay: 750ms;">
          <!-- Primary Download Button -->
          <button type="button" class="btn btn-primary" data-download aria-label="Download Argus for Windows">
            <span class="btn-icon" aria-hidden="true">
              <!-- Windows Logo SVG -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.949-1.949"/>
              </svg>
            </span>
            <span class="btn-label">Download for Windows</span>
            <span class="btn-chevron" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </span>
          </button>

          <!-- Secondary Story Button -->
          <button type="button" class="btn btn-secondary" id="watchStoryBtn" aria-haspopup="dialog" aria-controls="storyModal">
            <span class="btn-icon play-icon-wrapper" aria-hidden="true">
              <!-- Circular Play Icon SVG -->
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10" stroke="currentColor"/>
                <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
              </svg>
            </span>
            <span class="btn-label">Watch the Story</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ========================================================= -->
  <!-- PLACEHOLDER SECTIONS FOR PAGE FLOW                        -->
  <!-- ========================================================= -->
  <section id="legend" class="placeholder-section" aria-label="The Legend Section">
    <!-- Legend content will be built in the next phase -->
  </section>

  <section id="features" class="placeholder-section" aria-label="Features Section">
    <!-- Features content will be built in the next phase -->
  </section>

  <section id="cta" class="placeholder-section" aria-label="Call to Action Section">
    <!-- Final CTA content will be built in the next phase -->
  </section>

  <!-- ========================================================= -->
  <!-- STORY VIDEO MODAL OVERLAY                                 -->
  <!-- ========================================================= -->
  <div id="storyModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-container">
      <header class="modal-header">
        <h2 id="modalTitle" class="modal-title">The Legend of Argus</h2>
        <button type="button" class="modal-close-btn" data-close-modal aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <!-- 16:9 Video Box (Can be replaced with <video> or <iframe> later) -->
      <div class="modal-media-wrapper">
        <div class="video-placeholder" id="videoContainer">
          <div class="placeholder-content">
            <div class="placeholder-icon" aria-hidden="true">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
              </svg>
            </div>
            <p class="placeholder-text">Story video coming soon</p>
            <span class="placeholder-subtext">The myth of the all-seeing guardian is being prepared.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
